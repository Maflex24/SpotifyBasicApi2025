services:
  db:
    image: mysql:8.0
    container_name: spotifybasic-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - edge-proxy

  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    container_name: spotifybasic-webapi
    depends_on:
      - db
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DB_PROVIDER=MySql
      - ConnectionStrings__DbConnectionString=${ConnectionStrings__DbConnectionString}
      - ASPNETCORE_ENVIRONMENT=Production
      - Frontend__Url=${FRONTEND_URL}
      - Spotify__ClientId=${SPOTIFY_CLIENT_ID}
      - Spotify__ClientSecret=${SPOTIFY_CLIENT_SECRET}
      - Spotify__RedirectUri=${SPOTIFY_REDIRECT_URI}
      - Spotify__ApiUrl=${SPOTIFY_API_URL}
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    entrypoint: ["/bin/sh", "-c", "sleep 25 && dotnet SpotifyBasicApi2025.dll"]
    networks:
      edge-proxy:
        aliases:
          - spotify-webapi

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: spotifybasic-frontend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - webapi
    volumes:
      - ${FRONTEND_APPSETTINGS_PATH:-./Frontend/wwwroot/appsettings.json}:/usr/share/nginx/html/appsettings.json:ro
    networks:
      edge-proxy:
        aliases:
          - spotify-frontend

networks:
  edge-proxy:
    external: true
    name: edge-proxy

volumes:
  db_data:
  data_protection_keys:
