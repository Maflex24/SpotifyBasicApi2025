server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serwuj statyczne pliki normalnie
    location /_framework/ {
        try_files $uri =404;
    }

    location /css/ {
        try_files $uri =404;
    }

    location /js/ {
        try_files $uri =404;
    }

    location /favicon.png {
        try_files $uri =404;
    }

    # Fallback dla tras SPA (np. /callback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}


